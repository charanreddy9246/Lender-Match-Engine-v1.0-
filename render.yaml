services:
  # The FastAPI backend (backend_cat) — the API the Netlify frontend talks to.
  #
  # The daily Ambak scraper (app/scrape_ambak_rates.py) deliberately does NOT
  # run here — it runs as a free GitHub Actions scheduled workflow instead
  # (.github/workflows/scrape-ambak-rates.yml), since Render's Cron Jobs have
  # no free plan and this repo is public (so GitHub Actions minutes are
  # unlimited and free for it). That's also why Playwright/Chromium — only
  # needed by the scraper — isn't installed here; this service never needs
  # a headless browser.
  - type: web
    name: lender-match-engine-api
    runtime: python
    rootDir: backend_cat
    plan: free
    buildCommand: "pip install -e ."
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: firebase-service-account.json
      - key: PYTHON_VERSION
        value: "3.12.7"
